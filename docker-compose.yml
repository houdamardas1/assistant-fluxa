services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: morocco-api:local
    container_name: morocco-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Les deux bases SQLite vont dans le volume persistant ci-dessous.
      AUDIT_DB_PATH: data/db/audit.db
      USERS_DB_PATH: data/db/users.db
    volumes:
      # Index FAISS en lecture seule (lourd, rarement modifie)
      - ./data/index:/app/data/index:ro
      # Audit + utilisateurs : lecture-ecriture, persistants
      - app_db:/app/data/db

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Adresse de l'API vue par le NAVIGATEUR (integree au build)
        VITE_API_URL: http://localhost:8000
    image: morocco-web:local
    container_name: morocco-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:8080"

  postgres:
    image: postgres:16-alpine
    container_name: morocco-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: morocco-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  app_db:
  pg_data:
  pgadmin_data:
